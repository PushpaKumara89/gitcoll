name: Spring Boot CD

on:
  push:
    branches:
      - main
permissions:
  contents: read
  packages: write

jobs:
  build-artifact:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build JAR
        run: ./mvnw clean package -DskipTests
      
      - name: Build Docker image
        run: docker build -t gitcoll:${{ github.sha }} .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker tag gitcoll:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/gitcoll:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/gitcoll:${{ github.sha }

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitcoll-jar
          path: target/*.jar